<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantamor Commands | Bot & Dashboard</title>
    <style>
        :root {
            --bg-black: #050505;
            --bg-panel: #0d0d0d;
            --bg-card: #121212;
            --white: #ffffff;
            --gray-light: #cccccc;
            --gray-dark: #333333;
            --glow-white: 0 0 15px rgba(255, 255, 255, 0.35);
            --glow-strong: 0 0 25px rgba(255, 255, 255, 0.7);
            --green: #00ff66;
            --red: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08) 0%, transparent 60%);
        }

        /* Barra Superior y Botón 3 Rayitas */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 1000;
        }

        .menu-toggle {
            background: transparent;
            border: 1px solid var(--white);
            color: var(--white);
            font-size: 1.6rem;
            width: 45px;
            height: 45px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--glow-white);
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            background: var(--white);
            color: var(--bg-black);
            box-shadow: var(--glow-strong);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }

        /* Menú Lateral Desplegable (3 rayitas) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -290px;
            width: 280px;
            height: 100vh;
            background: var(--bg-panel);
            border-right: 1px solid var(--white);
            box-shadow: 5px 0 30px rgba(255, 255, 255, 0.2);
            padding: 85px 20px 30px;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar.open {
            left: 0;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            z-index: 998;
        }

        .overlay.active {
            display: block;
        }

        .nav-btn {
            background: transparent;
            color: var(--gray-light);
            border: 1px solid transparent;
            padding: 14px 18px;
            text-align: left;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--white);
            color: var(--bg-black);
            box-shadow: var(--glow-strong);
            transform: translateX(5px);
        }

        /* Contenedor Principal */
        .main-content {
            max-width: 1150px;
            margin: 0 auto;
            padding: 105px 20px 60px;
        }

        .tab-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tarjetas con Resplandor Blanco */
        .glow-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 14px;
            padding: 25px;
            box-shadow: var(--glow-white);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .glow-card:hover {
            box-shadow: var(--glow-strong);
            border-color: var(--white);
        }

        .btn-white {
            background: var(--white);
            color: var(--bg-black);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: var(--glow-white);
            transition: all 0.25s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-white:hover {
            transform: scale(1.03);
            box-shadow: var(--glow-strong);
        }

        .btn-outline {
            background: transparent;
            color: var(--white);
            border: 1px solid var(--white);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
        }

        .btn-outline:hover {
            background: var(--white);
            color: var(--bg-black);
            box-shadow: var(--glow-white);
        }

        h2.section-title {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        p.section-sub {
            color: var(--gray-light);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        /* 1. INICIO */
        .hero-box {
            text-align: center;
            padding: 50px 25px;
            margin-bottom: 35px;
        }

        .hero-box h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        /* 2. FUNCIONES */
        .func-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            padding: 14px;
            background: var(--bg-panel);
            border: 1px solid var(--white);
            border-radius: 8px;
            color: var(--white);
            margin-bottom: 20px;
            font-size: 1rem;
            box-shadow: var(--glow-white);
            outline: none;
        }

        .cmd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .cmd-tag {
            background: var(--white);
            color: var(--bg-black);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 800;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        /* 3. ESTADO */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--white);
            font-weight: 700;
            margin-bottom: 25px;
            box-shadow: var(--glow-white);
        }

        .stat-number {
            font-size: 2.8rem;
            font-weight: 900;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.8);
            margin: 10px 0;
        }

        /* 4. INVITAR BOT */
        .server-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .server-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .server-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--white);
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: var(--glow-white);
        }

        .role-badge {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid var(--white);
            text-transform: uppercase;
            font-weight: bold;
        }

        /* 5. PLANES */
        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .plan-list {
            list-style: none;
            margin: 20px 0 30px;
        }

        .plan-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }

            display: flex;
